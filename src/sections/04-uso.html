<!-- 04 · Área de proteção e usos incorretos -->
<section id="sec-uso" class="doc-band" data-theme="dark" aria-labelledby="sec-uso-title">
  <div class="doc-section">
    <header class="doc-head">
      <p class="doc-eyebrow">Marca</p>
      <h2 class="doc-title" id="sec-uso-title">Área de proteção e usos incorretos</h2>
      <p class="doc-lead">
        Área livre de um quarto da altura do símbolo em todos os lados. Nada
        entra nela: texto, borda, outro logo.
      </p>
    </header>

    <div class="logo-stage on-dark">
      <div class="clearspace" style="--clear: 120px">
        <svg width="120" height="120" role="img" aria-label="Símbolo com área de proteção"><use href="#symbol-full"/></svg>
      </div>
    </div>

    <div class="dont-grid">
      <figure class="dont dont-stretch"><div class="logo-stage on-dark"><svg class="logo-symbol" role="img" aria-label="Símbolo distorcido"><use href="#symbol-full"/></svg></div><figcaption class="dont-caption"><i class="ico" data-icon="falha-fechar"></i>Não distorcer nem esticar.</figcaption></figure>
      <figure class="dont dont-rotate"><div class="logo-stage on-dark"><svg class="logo-symbol" role="img" aria-label="Símbolo girado"><use href="#symbol-full"/></svg></div><figcaption class="dont-caption"><i class="ico" data-icon="falha-fechar"></i>Não girar: o eixo é vertical.</figcaption></figure>
      <figure class="dont dont-color"><div class="logo-stage on-dark"><svg class="logo-symbol" role="img" aria-label="Símbolo em cor de destaque"><use href="#symbol-full"/></svg></div><figcaption class="dont-caption"><i class="ico" data-icon="falha-fechar"></i>Não colorir: o símbolo herda a cor do fundo.</figcaption></figure>
      <figure class="dont"><div class="logo-stage on-photo dont-busy"><svg class="logo-symbol" role="img" aria-label="Símbolo sobre fundo carregado"><use href="#symbol-full"/></svg></div><figcaption class="dont-caption"><i class="ico" data-icon="falha-fechar"></i>Não aplicar sobre fundo que disputa com o traço.</figcaption></figure>
    </div>
  </div>
</section>
